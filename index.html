<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新鸳鸯蝴蝶梦 - 歌曲练习</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7fbf8;
      --ink: #24332e;
      --muted: #64766f;
      --leaf: #5aa36f;
      --leaf-dark: #397e53;
      --peach: #ffb38a;
      --rose: #ff7f9a;
      --sky: #7fc7d9;
      --butter: #ffe18a;
      --panel: rgba(255, 255, 255, 0.9);
      --line: rgba(58, 104, 78, 0.16);
      --shadow: 0 18px 42px rgba(55, 96, 78, 0.16);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 14%, rgba(255, 225, 138, 0.32), transparent 24rem),
        radial-gradient(circle at 86% 10%, rgba(127, 199, 217, 0.22), transparent 22rem),
        linear-gradient(180deg, #f2fbf5 0%, #fff8ef 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: auto auto 4vh -4vw;
      width: 28vw;
      height: 28vw;
      max-width: 280px;
      max-height: 280px;
      background:
        radial-gradient(ellipse at 48% 80%, rgba(57, 126, 83, 0.22) 0 10%, transparent 11%),
        radial-gradient(ellipse at 40% 44%, rgba(90, 163, 111, 0.18) 0 28%, transparent 29%),
        radial-gradient(ellipse at 62% 42%, rgba(127, 199, 217, 0.14) 0 27%, transparent 28%);
      transform: rotate(-12deg);
      pointer-events: none;
      z-index: -1;
    }

    body::after {
      inset: 8vh -5vw auto auto;
      transform: rotate(18deg);
      opacity: 0.82;
    }

    button,
    select,
    input {
      font: inherit;
    }

    button {
      min-height: 56px;
      border: 0;
      border-radius: var(--radius);
      cursor: pointer;
      background: #fff;
      color: var(--ink);
      box-shadow: inset 0 0 0 2px var(--line);
      transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
      touch-action: manipulation;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: inset 0 0 0 2px rgba(57, 126, 83, 0.32), 0 10px 18px rgba(57, 126, 83, 0.12);
    }

    button:active {
      transform: translateY(0);
    }

    button.primary {
      background: var(--leaf);
      color: #fff;
      box-shadow: none;
    }

    button.warm {
      background: var(--peach);
      color: #402415;
      box-shadow: none;
    }

    button.small {
      min-height: 48px;
      padding: 0 16px;
      font-size: 20px;
      font-weight: 800;
    }

    .ko {
      display: inline-block;
      margin-left: 8px;
      font-size: 0.72em;
      line-height: 1.05;
      font-weight: 800;
      color: currentColor;
      opacity: 0.72;
    }

    .app {
      width: min(1280px, calc(100% - 28px));
      margin: 0 auto;
      padding: 18px 0 28px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: end;
      padding: 14px 0 18px;
    }

    .title h1 {
      margin: 0;
      font-size: clamp(40px, 6vw, 84px);
      line-height: 1.05;
      letter-spacing: 0;
      color: #244136;
    }

    .title p {
      margin: 10px 0 0;
      font-size: clamp(20px, 2.3vw, 30px);
      color: var(--muted);
      font-weight: 700;
    }

    .mode-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .mode-tabs button {
      padding: 0 22px;
      font-size: 24px;
      font-weight: 900;
    }

    .mode-tabs button.active {
      background: var(--leaf-dark);
      color: #fff;
      box-shadow: none;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(340px, 0.75fr);
      gap: 18px;
      align-items: start;
    }

    .stage,
    .side,
    .game-panel {
      background: var(--panel);
      border: 2px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .stage {
      min-height: 620px;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .scene {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .flower {
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, #ffe18a 0 16%, transparent 17%),
        radial-gradient(circle at 50% 18%, #ff9bad 0 20%, transparent 21%),
        radial-gradient(circle at 82% 50%, #ff9bad 0 20%, transparent 21%),
        radial-gradient(circle at 50% 82%, #ff9bad 0 20%, transparent 21%),
        radial-gradient(circle at 18% 50%, #ff9bad 0 20%, transparent 21%);
      opacity: 0.75;
    }

    .flower.one {
      right: 24px;
      top: 24px;
      transform: rotate(18deg);
    }

    .flower.two {
      left: 24px;
      bottom: 24px;
      width: 54px;
      height: 54px;
      transform: rotate(-10deg);
      opacity: 0.55;
    }

    .butterfly {
      position: absolute;
      width: 92px;
      height: 66px;
      left: 54%;
      top: 8%;
      animation: flutter 6s ease-in-out infinite;
    }

    .butterfly::before,
    .butterfly::after {
      content: "";
      position: absolute;
      width: 42px;
      height: 54px;
      border-radius: 70% 35% 70% 35%;
      background: linear-gradient(135deg, var(--butter), #ff9bad);
      transform-origin: right center;
    }

    .butterfly::before {
      left: 5px;
      transform: rotate(-18deg);
    }

    .butterfly::after {
      right: 5px;
      transform: scaleX(-1) rotate(-18deg);
    }

    .butterfly span {
      position: absolute;
      left: 43px;
      top: 15px;
      width: 6px;
      height: 38px;
      border-radius: 99px;
      background: #6a4b3a;
      z-index: 1;
    }

    @keyframes flutter {
      0%, 100% { transform: translateY(0) rotate(5deg); }
      50% { transform: translateY(18px) rotate(-4deg); }
    }

    .line-card {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 16px;
      align-content: center;
      min-height: 440px;
      padding: 28px 18px;
      text-align: center;
    }

    .line-number {
      margin: 0 auto;
      display: inline-grid;
      place-items: center;
      min-width: 96px;
      height: 64px;
      padding: 0 20px;
      border-radius: 999px;
      background: #fff5c8;
      color: #735316;
      font-size: 30px;
      font-weight: 900;
      border: 2px solid rgba(115, 83, 22, 0.16);
    }

    .lyric {
      margin: 0;
      font-size: clamp(62px, 8.5vw, 116px);
      line-height: 1.12;
      font-weight: 900;
      letter-spacing: 0;
      text-wrap: balance;
    }

    .karaoke-char {
      display: inline-block;
      color: var(--ink);
      transition: color 80ms linear;
    }

    .lyric-blank {
      display: inline-flex;
      align-items: stretch;
      gap: 0.03em;
      height: 0.92em;
      min-width: 1.8em;
      margin: 0 0.08em;
      vertical-align: -0.08em;
      border-radius: 8px 8px 4px 4px;
      background: rgba(255, 225, 138, 0.28);
      box-shadow: inset 0 -0.18em 0 rgba(255, 127, 154, 0.28);
      overflow: hidden;
    }

    .full-line.active .lyric-blank {
      background: rgba(127, 199, 217, 0.18);
      box-shadow: inset 0 -0.18em 0 rgba(23, 110, 154, 0.34);
    }

    .karaoke-blank-unit {
      flex: 1 1 0;
      min-width: 0.28em;
      border-radius: 4px;
      transition: background 80ms linear;
    }

    .full-line.active .karaoke-blank-unit.filled {
      background: rgba(22, 135, 200, 0.72);
    }

    .full-line.past .karaoke-blank-unit.filled {
      background: rgba(57, 126, 83, 0.36);
    }

    .lyric.karaoke-active .karaoke-char.filled {
      color: var(--rose);
    }

    .lyric.karaoke-student .karaoke-char.filled {
      color: #1687c8;
    }

    .pinyin {
      min-height: 48px;
      margin: 0;
      font-size: clamp(28px, 3.8vw, 48px);
      line-height: 1.2;
      color: #176e9a;
      font-weight: 850;
    }

    .meaning {
      min-height: 36px;
      margin: 0 auto;
      max-width: 820px;
      font-size: clamp(22px, 2.5vw, 34px);
      line-height: 1.28;
      color: var(--muted);
      font-weight: 800;
    }

    .controls {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .controls button {
      padding: 0 12px;
      font-size: clamp(20px, 2.1vw, 28px);
      font-weight: 900;
      white-space: nowrap;
    }

    .settings {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .toggle {
      min-height: 54px;
      display: grid;
      place-items: center;
      border: 2px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.72);
      font-size: 22px;
      font-weight: 900;
      cursor: pointer;
      user-select: none;
    }

    .toggle input {
      position: absolute;
      opacity: 0;
    }

    .toggle:has(input:checked) {
      background: #dff2e5;
      border-color: rgba(57, 126, 83, 0.32);
      color: var(--leaf-dark);
    }

    .side {
      order: 2;
      padding: 16px;
      display: grid;
      gap: 14px;
    }

    .progress-toggle {
      display: none;
      width: 100%;
      min-height: 62px;
      font-size: clamp(22px, 2.5vw, 32px);
      font-weight: 900;
      background: #e3f4fb;
      color: #176e9a;
    }

    .progress {
      display: grid;
      gap: 10px;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 22px;
      color: var(--muted);
      font-weight: 900;
    }

    .bar {
      height: 16px;
      border-radius: 999px;
      background: rgba(90, 163, 111, 0.16);
      overflow: hidden;
    }

    .bar span {
      display: block;
      height: 100%;
      width: 5%;
      background: linear-gradient(90deg, var(--leaf), var(--sky));
      border-radius: inherit;
      transition: width 220ms ease;
    }

    .playlist {
      display: grid;
      gap: 8px;
      max-height: 620px;
      overflow: auto;
      padding-right: 4px;
    }

    .playlist button {
      min-height: 72px;
      padding: 8px 12px;
      text-align: left;
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 12px;
      align-items: center;
      font-size: 24px;
      font-weight: 900;
      background: rgba(255, 255, 255, 0.72);
    }

    .playlist button.active {
      background: #e3f4fb;
      box-shadow: inset 0 0 0 2px rgba(23, 110, 154, 0.28);
    }

    .badge {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #fff5c8;
      color: #735316;
      font-size: 20px;
    }

    .game-panel {
      grid-column: 1 / -1;
      order: 3;
      padding: 18px;
      display: none;
    }

    .game-panel.active {
      display: grid;
      gap: 16px;
    }

    .app.game-mode main {
      grid-template-columns: 1fr;
    }

    .app.game-mode .game-panel.active {
      order: 1;
    }

    .app.game-mode .side {
      grid-column: 1 / -1;
      order: 2;
    }

    .app.game-mode .progress-toggle {
      display: block;
    }

    .app.game-mode .side:not(.open) .progress,
    .app.game-mode .side:not(.open) .playlist {
      display: none;
    }

    .game-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .game-head h2 {
      margin: 0;
      font-size: clamp(30px, 4vw, 48px);
    }

    .game-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .memory-levels {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .memory-levels button {
      min-height: 52px;
      padding: 0 18px;
      font-size: clamp(20px, 2vw, 26px);
      font-weight: 900;
    }

    .memory-levels button.active {
      background: var(--leaf-dark);
      color: #fff;
      box-shadow: none;
    }

    .memory-line,
    .order-target {
      min-height: 150px;
      display: grid;
      place-items: center;
      padding: 20px;
      border-radius: var(--radius);
      background: #fff;
      border: 2px dashed rgba(57, 126, 83, 0.32);
      text-align: center;
      font-size: clamp(48px, 7vw, 92px);
      line-height: 1.18;
      font-weight: 900;
      letter-spacing: 0;
    }

    .full-panel {
      grid-column: 1 / -1;
      order: 3;
      padding: 18px;
      display: none;
      background: var(--panel);
      border: 2px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .full-panel.active {
      display: grid;
      gap: 16px;
    }

    .app.game-mode .full-panel.active {
      order: 1;
    }

    .full-mode-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .full-mode-buttons button {
      min-height: 58px;
      padding: 0 18px;
      font-size: clamp(21px, 2.1vw, 28px);
      font-weight: 900;
    }

    .full-mode-buttons button.active {
      background: var(--leaf-dark);
      color: #fff;
      box-shadow: none;
    }

    .full-controls {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .full-controls button {
      font-size: clamp(22px, 2.4vw, 32px);
      font-weight: 900;
    }

    .full-progress {
      height: 18px;
      border-radius: 999px;
      background: rgba(23, 110, 154, 0.14);
      overflow: hidden;
    }

    .full-progress span {
      display: block;
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--sky), var(--leaf));
      border-radius: inherit;
    }

    .full-lyrics {
      max-height: min(68vh, 720px);
      overflow: auto;
      display: grid;
      gap: 12px;
      padding: 12px 4px 18px;
      scroll-behavior: smooth;
    }

    .full-line {
      min-height: 136px;
      display: grid;
      grid-template-rows: auto auto;
      align-items: center;
      align-content: center;
      gap: 12px;
      padding: 18px 22px;
      text-align: center;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.72);
      border: 2px solid var(--line);
      font-weight: 900;
      color: rgba(36, 51, 46, 0.55);
      transition: background 160ms ease, color 160ms ease, box-shadow 160ms ease;
    }

    .full-line .lyric-main {
      display: block;
      font-size: clamp(38px, 5vw, 76px);
      line-height: 1.16;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .full-line.active .lyric-main .karaoke-char.filled {
      color: #1687c8;
    }

    .full-line .lyric-pinyin {
      display: block;
      font-size: clamp(20px, 2.2vw, 32px);
      line-height: 1.3;
      color: #176e9a;
      font-weight: 850;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .full-line.active {
      background: #e3f4fb;
      border-color: rgba(23, 110, 154, 0.34);
      color: #176e9a;
    }

    .full-line.past {
      color: rgba(57, 126, 83, 0.58);
    }

    .full-line.selected {
      box-shadow: inset 0 0 0 4px rgba(255, 127, 154, 0.34);
    }

    .full-lyrics.hide-pinyin .lyric-pinyin {
      display: none;
    }

    .calibration {
      display: none;
      grid-template-columns: 1fr;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border-radius: var(--radius);
      background: #fff8df;
      border: 2px dashed rgba(115, 83, 22, 0.24);
    }

    .calibration.active {
      display: grid;
    }

    .calibration-status {
      font-size: clamp(20px, 2.3vw, 30px);
      font-weight: 900;
      color: #735316;
    }

    .calibration button {
      min-height: 52px;
      padding: 0 16px;
      font-size: clamp(19px, 2vw, 26px);
      font-weight: 900;
    }

    .calibration-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .blank {
      display: inline-grid;
      place-items: center;
      min-width: 1.3em;
      margin: 0 0.05em;
      color: transparent;
      border-bottom: 0.12em solid var(--rose);
      background: #fff0f3;
      border-radius: 6px 6px 0 0;
    }

    .answer-bank,
    .order-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .answer-bank button,
    .order-bank button {
      min-width: 86px;
      min-height: 70px;
      padding: 0 22px;
      font-size: clamp(34px, 4vw, 54px);
      font-weight: 900;
      background: #fff8df;
      box-shadow: inset 0 0 0 2px rgba(115, 83, 22, 0.18);
    }

    .answer-bank button.correct {
      background: #dff2e5;
      color: var(--leaf-dark);
    }

    .answer-bank button.wrong {
      background: #ffe2e8;
      color: #9b2840;
    }

    .order-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .drop-zone {
      min-height: 120px;
      padding: 12px;
      border: 2px dashed rgba(23, 110, 154, 0.3);
      border-radius: var(--radius);
      background: #f5fcff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .drop-zone .picked {
      min-height: 60px;
      padding: 0 18px;
      border-radius: var(--radius);
      background: #fff;
      border: 2px solid rgba(23, 110, 154, 0.24);
      font-size: clamp(28px, 3vw, 42px);
      font-weight: 900;
    }

    .status {
      min-height: 42px;
      text-align: center;
      font-size: clamp(24px, 3vw, 38px);
      font-weight: 900;
      color: var(--leaf-dark);
    }

    .celebration {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(36, 51, 46, 0.18);
      backdrop-filter: blur(3px);
    }

    .celebration.show {
      display: grid;
    }

    .celebration-box {
      width: min(720px, 100%);
      padding: 36px 28px;
      border-radius: var(--radius);
      background: #fff;
      border: 3px solid rgba(90, 163, 111, 0.22);
      box-shadow: 0 30px 80px rgba(36, 51, 46, 0.26);
      text-align: center;
      animation: popIn 260ms ease forwards;
    }

    .celebration-emoji {
      font-size: clamp(58px, 8vw, 96px);
      line-height: 1;
    }

    .celebration-title {
      margin-top: 12px;
      font-size: clamp(42px, 6vw, 76px);
      line-height: 1.1;
      font-weight: 1000;
      color: var(--leaf-dark);
    }

    .celebration-text {
      margin-top: 12px;
      font-size: clamp(24px, 3vw, 38px);
      font-weight: 900;
      color: var(--muted);
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 980px) {
      header,
      main {
        grid-template-columns: 1fr;
      }

      .mode-tabs {
        justify-content: stretch;
      }

      .mode-tabs button {
        flex: 1;
      }

      .stage {
        min-height: auto;
      }

      .controls {
        grid-template-columns: repeat(2, 1fr);
      }

      .controls button.primary {
        grid-column: span 2;
      }

      .settings {
        grid-template-columns: 1fr;
      }

      .playlist {
        max-height: 360px;
      }

      .order-grid {
        grid-template-columns: 1fr;
      }

      .full-controls,
      .calibration {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .app {
        width: min(100% - 16px, 1280px);
      }

      .stage,
      .side,
      .game-panel {
        padding: 12px;
      }

      .lyric,
      .memory-line,
      .order-target {
        font-size: 46px;
      }

      .pinyin {
        font-size: 26px;
      }

      .meaning {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">
        <h1>新鸳鸯蝴蝶梦</h1>
        <p>中文歌曲练习课堂</p>
      </div>
      <nav class="mode-tabs" aria-label="练习模式">

    function karaokeHTML(text) {
      return [...text].map((char) => `<span class="karaoke-char">${char}</span>`).join("");
    }

    function wordRanges(line) {
      const ranges = [];
      let cursor = 0;
      (line.words || []).forEach((word, index) => {
        if (!word) return;
        const found = line.lyric.indexOf(word, cursor);
        const start = found >= 0 ? found : cursor;
        const end = Math.min(line.lyric.length, start + word.length);
        if (end > start) {
          ranges.push({ index, start, end });
          cursor = end;
        }
      });
      return ranges;
    }

    function buildBlankPlan(sourceLines) {
      return sourceLines.map((line) => {
        const ranges = wordRanges(line);
        if (!ranges.length) return [];
        const picks = shuffle(ranges.map((range) => range.index));
        return [picks[0]];
      });
    }

    function karaokeHTMLWithBlanks(line, blankWordIndexes = []) {
      const ranges = wordRanges(line);
      const blankSet = new Set(blankWordIndexes);
      const blankRanges = ranges.filter((range) => blankSet.has(range.index));
      const rangeByStart = new Map(blankRanges.map((range) => [range.start, range]));
      let html = "";
      for (let i = 0; i < line.lyric.length; i += 1) {
        const range = rangeByStart.get(i);
        if (range) {
          const word = line.lyric.slice(range.start, range.end);
          const units = [...word].map(() => '<span class="karaoke-blank-unit"></span>').join("");
          html += `<span class="lyric-blank" data-answer="${word}" style="width: ${Math.max(1.8, word.length * 1.08)}em">${units}</span>`;
          i = range.end - 1;
          continue;
        }
        html += `<span class="karaoke-char">${line.lyric[i]}</span>`;
      }
      return html;
    }

    function fillKaraokeChars(container, progress) {
      const chars = container.querySelectorAll(".karaoke-char, .karaoke-blank-unit");
      const filledCount = Math.ceil((Math.max(0, Math.min(100, progress)) / 100) * chars.length);
      chars.forEach((char, index) => {
        char.classList.toggle("filled", index < filledCount);
      });
    }

    function setLine(index, shouldPlay = false) {
      const safeIndex = normalizeLineIndex(index);
      if (safeIndex === null) return;
      player.onended = null;
      stopStudentSing();
      current = safeIndex;
      const line = lines[current];
      lineNumber.textContent = `${current + 1} / ${lines.length}`;

      lyricText.classList.remove("karaoke-active");
      lyricText.classList.remove("karaoke-student");
      pinyinText.textContent = line.pinyin;
      meaningText.textContent = line.meaning;
      progressText.textContent = `${current + 1} / ${lines.length}`;
      progressBar.style.width = `${((current + 1) / lines.length) * 100}%`;
      player.src = line.audio;
      playlist.querySelectorAll("button").forEach((btn, index) => {
        btn.classList.toggle("active", index === current);
      });
      if (shouldPlay) playCurrent();
    }

    function playCurrent() {
      stopStudentSing();
      fillKaraokeChars(lyricText, 0);
      lyricText.classList.add("karaoke-active");
      lyricText.classList.remove("karaoke-student");

      player.play().catch(() => {});

    function updateKaraokeProgress() {
      if (!player.duration || Number.isNaN(player.duration)) return;
      const progress = Math.min(100, Math.max(0, (player.currentTime / player.duration) * 100));
      fillKaraokeChars(lyricText, progress);
    }

    function stopStudentSing() {
      window.cancelAnimationFrame(studentSingFrame);
      window.clearTimeout(studentSingTimer);
      studentSingFrame = null;
      studentSingTimer = null;
      lyricText.classList.remove("karaoke-student");
    }

    function runStudentKaraoke() {
      const duration = lastPracticeDuration || 3600;
      const startedAt = performance.now();
      fillKaraokeChars(lyricText, 0);
      lyricText.classList.remove("karaoke-active");
      lyricText.classList.add("karaoke-student");

      const step = (now) => {
        const progress = Math.min(100, ((now - startedAt) / duration) * 100);
        fillKaraokeChars(lyricText, progress);
        if (progress < 100) {
          studentSingFrame = window.requestAnimationFrame(step);
        } else {
          lyricText.classList.remove("karaoke-student");
        }
      };
      studentSingFrame = window.requestAnimationFrame(step);
    }

      if (app.classList.contains("game-mode")) return;
      runStudentKaraoke();

      return fullTrack === "vocal" ? fullVocalLines : lines;
    }

    function currentFullDurations() {
      return fullTrack === "vocal" ? fullVocalDurations : lineDurations;
    }

    function progressLines() {
      return activePanel === "full" ? currentFullLines() : lines;
    }

    function buildPlaylist(sourceLines = progressLines()) {
      playlist.innerHTML = "";
      sourceLines.forEach((line, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.innerHTML = `<span class="badge">${index + 1}</span><span>${line.lyric}</span>`;
        button.addEventListener("click", () => handleProgressLineClick(index));
        playlist.appendChild(button);
      });
    }

    function buildFullLyrics() {
      fullLyrics.innerHTML = "";
      currentFullLines().forEach((line, index) => {
        const item = document.createElement("div");
        item.className = "full-line";
        item.dataset.index = String(index);
        const lyricHTML = fullBlankMode
          ? karaokeHTMLWithBlanks(line, fullBlankPlan[index] || [])
          : karaokeHTML(line.lyric);
        item.innerHTML = `<span class="lyric-main">${lyricHTML}</span><span class="lyric-pinyin">${line.pinyin}</span>`;
        item.addEventListener("click", () => selectFullLine(index));
        fullLyrics.appendChild(item);
      });
    }

    function updateFullBlankControls() {
      fullBlankModeBtn.classList.toggle("primary", fullBlankMode);
      blankRefreshBtn.hidden = !fullBlankMode;
      fullBlankModeBtn.innerHTML = fullBlankMode
        ? '关闭填空<span class="ko">빈칸 끄기</span>'
        : '歌词填空<span class="ko">가사 빈칸</span>';
    }

    function setFullBlankMode(enabled) {
      fullBlankMode = enabled;
      if (fullBlankMode && fullBlankPlan.length !== currentFullLines().length) {
        fullBlankPlan = buildBlankPlan(currentFullLines());
      }
      updateFullBlankControls();
      buildFullLyrics();
      updateFullLyrics(fullActiveIndex);
      fullLyrics.querySelector(`[data-index="${selectedFullIndex}"]`)?.scrollIntoView({ block: "center", behavior: "smooth" });
    }

    function refreshFullBlanks() {
      fullBlankPlan = buildBlankPlan(currentFullLines());
      if (!fullBlankMode) fullBlankMode = true;
      setFullBlankMode(true);
    }

    function handleProgressLineClick(index) {
      if (activePanel === "memory") {
        setLine(index, false);
        newMemoryRound(index);
        return;
      }
      if (activePanel === "order") {
        setLine(index, false);
        newOrderRound(index);
        return;
      }
      if (activePanel === "full") {
        selectFullLine(index);
        return;
      }
      setLine(index, true);
    }

    function setPanel(panelName) {
      activePanel = panelName;
      player.pause();
      if (panelName !== "full") fullPlayer.pause();
      document.querySelectorAll(".mode-tabs button").forEach((button) => {
        button.classList.toggle("active", button.dataset.panel === panelName);
      });
      app.classList.toggle("game-mode", panelName !== "practice");
      side.classList.remove("open");
      progressToggle.innerHTML = '打开课堂进度<span class="ko">진도 열기</span>';
      document.getElementById("practicePanel").classList.toggle("hidden", panelName !== "practice");
      document.getElementById("memoryPanel").classList.toggle("active", panelName === "memory");
      document.getElementById("orderPanel").classList.toggle("active", panelName === "order");
      document.getElementById("fullPanel").classList.toggle("active", panelName === "full");
      buildPlaylist();
      if (panelName === "memory") newMemoryRound();
      if (panelName === "order") newOrderRound();
      if (panelName === "full") prepareFullTrack(fullTrack);
    }

    function timelineStorageKey() {
      return `song-practice-full-timeline-${fullTrack}`;
    }

    function savedTimelineStarts() {
      try {
        const parsed = JSON.parse(localStorage.getItem(timelineStorageKey()) || "null");
        if (
          Array.isArray(parsed)
          && parsed.length <= currentFullLines().length
          && parsed.every((value) => Number.isFinite(value))
        ) {
          return parsed;
        }
      } catch (error) {
        return builtInTimelineStarts[fullTrack] || null;
      }
      return builtInTimelineStarts[fullTrack] || null;
    }

    function createFullTimeline() {
      const track = fullTracks[fullTrack];
      const total = fullPlayer.duration && !Number.isNaN(fullPlayer.duration)
        ? fullPlayer.duration
        : track.fallbackDuration;
      const savedStarts = savedTimelineStarts();
      const fullLines = currentFullLines();
      const durations = currentFullDurations();
      const baseTotal = durations.reduce((sum, duration) => sum + duration, 0);
      const usable = Math.max(baseTotal, total - track.intro - track.outro);
      const scale = usable / baseTotal;
      let cursor = track.intro;
      fullTimeline = fullLines.map((line, index) => {
        const start = cursor;
        const end = start + durations[index] * scale;
        cursor = end;
        return { start, end };
      });
      if (savedStarts) {
        savedStarts.forEach((start, index) => {
          fullTimeline[index].start = start;
        });
        fullTimeline.forEach((item, index) => {
          item.end = fullTimeline[index + 1]?.start ?? item.end;
        });
      }
    }

    function prepareFullTrack(trackName) {
      fullTrack = trackName;
      fullPlayer.pause();
      fullPlayer.src = fullTracks[fullTrack].src;
      fullPlayer.currentTime = 0;
      fullProgressBar.style.width = "0%";
      fullActiveIndex = -1;
      selectedFullIndex = 0;
      fullBlankPlan = [];
      updateFullBlankControls();
      buildFullLyrics();
      buildPlaylist();
      createFullTimeline();
      updateFullLyrics(-1);
      selectFullLine(0, false);
      updateCalibrationStatus();
    }

    function updateFullLyrics(activeIndex) {
      fullLyrics.querySelectorAll(".full-line").forEach((item, index) => {
        item.classList.toggle("active", index === activeIndex);
        item.classList.toggle("past", index < activeIndex);
        item.classList.toggle("selected", index === selectedFullIndex);
        const lyricMain = item.querySelector(".lyric-main");
        if (index !== activeIndex) {
          if (lyricMain) fillKaraokeChars(lyricMain, index < activeIndex ? 100 : 0);
        }
      });
      if (activeIndex >= 0) {
        const activeItem = fullLyrics.querySelector(`[data-index="${activeIndex}"]`);
        activeItem?.scrollIntoView({ block: "center", behavior: "smooth" });
      }
    }

    function updateFullSong() {
      const fullLines = currentFullLines();
      const duration = fullPlayer.duration && !Number.isNaN(fullPlayer.duration)
        ? fullPlayer.duration
        : fullTracks[fullTrack].fallbackDuration;
      const time = fullPlayer.currentTime;
      fullProgressBar.style.width = `${Math.min(100, (time / duration) * 100)}%`;
      if (!fullTimeline.length) createFullTimeline();
      const activeIndex = fullTimeline.findIndex((item) => time >= item.start && time < item.end);
      if (activeIndex !== fullActiveIndex) {
        fullActiveIndex = activeIndex;
        updateFullLyrics(activeIndex);
      }
      if (activeIndex >= 0) {
        const segment = fullTimeline[activeIndex];
        const lineProgress = Math.min(100, Math.max(0, ((time - segment.start) / Math.max(0.1, segment.end - segment.start)) * 100));
        const lyricMain = fullLyrics.querySelector(`[data-index="${activeIndex}"] .lyric-main`);
        if (lyricMain) fillKaraokeChars(lyricMain, lineProgress);
      }
    }

    function selectFullLine(index, shouldScroll = true) {
      if (!fullTimeline.length) createFullTimeline();
      const fullLines = currentFullLines();
      selectedFullIndex = Math.max(0, Math.min(index, fullLines.length - 1));
      current = selectedFullIndex;
      progressText.textContent = `${current + 1} / ${fullLines.length}`;
      progressBar.style.width = `${((current + 1) / fullLines.length) * 100}%`;
      playlist.querySelectorAll("button").forEach((btn, buttonIndex) => {
        btn.classList.toggle("active", buttonIndex === current);
      });
      if (calibrationMode) {
        calibrationIndex = selectedFullIndex;
        updateCalibrationStatus();
      }
      updateFullLyrics(fullActiveIndex);
      if (shouldScroll) {
        fullLyrics.querySelector(`[data-index="${selectedFullIndex}"]`)?.scrollIntoView({ block: "center", behavior: "smooth" });
      }
      seekFullLine(selectedFullIndex);
    }

    function seekFullLine(index) {
      if (!fullTimeline.length) createFullTimeline();
      fullPlayer.currentTime = fullTimeline[index]?.start ?? 0;
      updateFullSong();
    }

    function updateCalibrationStatus() {
      if (!calibrationMode) return;
      const saved = savedTimelineStarts() ? "已保存校准，可重新标记覆盖。" : "尚未保存校准。";
      const fullLines = currentFullLines();
      const time = Number.isFinite(calibrationTimes[calibrationIndex])
        ? `当前时间 ${calibrationTimes[calibrationIndex].toFixed(2)} 秒。`
        : "";
      calibrationStatus.textContent = `第 ${calibrationIndex + 1} / ${fullLines.length} 句：${fullLines[calibrationIndex].lyric}。${time}${saved}`;
    }

    function saveCalibrationIfComplete() {
      if (calibrationTimes.filter((value) => Number.isFinite(value)).length !== currentFullLines().length) return false;
      persistCalibrationTimes();
      createFullTimeline();
      showCelebration('校准完成！<span class="ko">보정 완료!</span>', '以后会按这个时间滚动歌词。<span class="ko">앞으로 이 시간에 맞춰 움직여요.</span>', "✅");
      return true;
    }

    function persistCalibrationTimes() {
      const times = calibrationTimes
        .slice(0, currentFullLines().length)
        .map((value) => Number.isFinite(value) ? Math.max(0, value) : value);
      calibrationTimes = times;
      if (times.some((value) => Number.isFinite(value))) {
        localStorage.setItem(timelineStorageKey(), JSON.stringify(times));
      }
      createFullTimeline();
      updateFullSong();
      updateCalibrationStatus();
    }

    function shiftCalibration(scope, seconds) {
      if (!calibrationTimes.length) calibrationTimes = savedTimelineStarts() || [];
      if (scope === "all") {
        calibrationTimes = calibrationTimes.map((value) => Number.isFinite(value) ? value + seconds : value);
      } else {
        const index = calibrationMode ? calibrationIndex : selectedFullIndex;
        calibrationTimes[index] = Number.isFinite(calibrationTimes[index])
          ? calibrationTimes[index] + seconds
          : ((fullTimeline[index]?.start ?? fullPlayer.currentTime) + seconds);
      }
      persistCalibrationTimes();
    }

    function shuffle(items) {
      return [...items].sort(() => Math.random() - 0.5);
    }

    function wordBlanks(line) {
      return line.words.map((word) => {
        const start = line.lyric.indexOf(word);
        return { text: word, start, end: start + word.length };
      }).filter((word) => word.start >= 0);
    }

    function buildMemoryQuestion(line, mode) {
      const chars = [...line.lyric];
      if (mode === "char") {
        const start = Math.floor(Math.random() * chars.length);
        return [{ text: chars[start], start, end: start + 1 }];
      }

      const words = wordBlanks(line);
      if (mode === "word" || words.length === 1) {
        return [words[Math.floor(Math.random() * words.length)]];
      }

      const first = words[Math.floor(Math.random() * words.length)];
      const remaining = words.filter((word) => word.start !== first.start);
      const second = remaining[Math.floor(Math.random() * remaining.length)];
      return [first, second].sort((a, b) => a.start - b.start);
    }

    function renderMemoryLine() {
      const chars = [...lines[memoryIndex].lyric];
      const blanks = [...memoryAnswers].sort((a, b) => b.start - a.start);
      blanks.forEach((answer, answerIndex) => {
        const solved = memorySolved.has(answer.text);
        const display = solved ? answer.text : `<span class="blank">${answer.text}</span>`;
        chars.splice(answer.start, answer.end - answer.start, display);
      });
      document.getElementById("memoryLine").innerHTML = chars.join("");
    }

    function memoryOptionPool() {
      if (memoryMode === "char") {
        return [...new Set(lines.flatMap((line) => [...line.lyric]))];
      }
      return [...new Set(lines.flatMap((line) => line.words))];
    }

    function normalizeLineIndex(index) {
      return Number.isInteger(index) && index >= 0 && index < lines.length ? index : null;
    }

    function newMemoryRound(index = null) {
      const requestedIndex = normalizeLineIndex(index);
      memoryIndex = requestedIndex === null ? Math.floor(Math.random() * lines.length) : requestedIndex;
      memoryAnswers = buildMemoryQuestion(lines[memoryIndex], memoryMode);
      memorySolved = new Set();
      renderMemoryLine();
      document.getElementById("memoryStatus").textContent = "";
      const correctAnswers = memoryAnswers.map((answer) => answer.text);
      const distractors = shuffle(memoryOptionPool())
        .filter((text) => !correctAnswers.includes(text))
        .slice(0, memoryMode === "twoWords" ? 6 : 5);
      const options = shuffle([...correctAnswers, ...distractors]);
      const bank = document.getElementById("answerBank");
      bank.innerHTML = "";
      options.forEach((text) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = text;
        button.addEventListener("click", () => {
          const correct = correctAnswers.includes(text);
          button.classList.add(correct ? "correct" : "wrong");
          document.getElementById("memoryStatus").textContent = correct ? "" : "再想一想";
          if (correct) {
            memorySolved.add(text);
            renderMemoryLine();
            if (memorySolved.size === correctAnswers.length) {
              document.getElementById("memoryLine").textContent = lines[memoryIndex].lyric;
              showCelebration('答对了！<span class="ko">정답이에요!</span>', '记得真清楚，太棒了！<span class="ko">정말 잘 기억했어요!</span>', "🎉");
              setLine(memoryIndex, true);
            }
          }
        });
        bank.appendChild(button);
      });
    }

    function revealMemory() {
      document.getElementById("memoryLine").textContent = lines[memoryIndex].lyric;
      document.getElementById("memoryStatus").textContent = lines[memoryIndex].pinyin;
      setLine(memoryIndex, false);
    }

    function expectedOrder() {
      return Array.from({ length: orderCount }, (_, index) => orderStart + index + 1)
        .filter((index) => index < lines.length);
    }

    function newOrderRound(index = null) {
      const maxStart = Math.max(0, lines.length - orderCount - 1);
      const requestedIndex = normalizeLineIndex(index);
      orderStart = requestedIndex === null ? Math.floor(Math.random() * (maxStart + 1)) : Math.min(requestedIndex, maxStart);
      pickedOrder = [];
      document.getElementById("orderPrompt").textContent = lines[orderStart].lyric;
      document.getElementById("orderStatus").textContent = "";
      renderDropZone();
      renderOrderBank();
      setLine(orderStart, false);
    }

    function renderDropZone() {
      const zone = document.getElementById("dropZone");
      zone.innerHTML = "";
      if (!pickedOrder.length) {
        zone.textContent = " ";
        return;
      }
      pickedOrder.forEach((index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "picked";
        button.textContent = lines[index].lyric;
        button.addEventListener("click", () => {
          pickedOrder = pickedOrder.filter((value) => value !== index);
          renderDropZone();
          renderOrderBank();
        });
        zone.appendChild(button);
      });
    }

    function renderOrderBank() {
      const expected = expectedOrder();
      const distractors = [
        orderStart - 2,
        orderStart - 1,
        orderStart + orderCount + 1,
        orderStart + orderCount + 2,
        orderStart + orderCount + 3
      ].filter((index) => index >= 0 && index < lines.length && !expected.includes(index));
      const choices = shuffle([
        ...expected,
        ...shuffle(distractors).slice(0, 3)
      ]).filter((value, index, arr) => value < lines.length && arr.indexOf(value) === index);
      const bank = document.getElementById("orderBank");
      bank.innerHTML = "";
      choices.forEach((index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = lines[index].lyric;
        button.disabled = pickedOrder.includes(index);
        button.addEventListener("click", () => {
          if (!pickedOrder.includes(index) && pickedOrder.length < orderCount) pickedOrder.push(index);
          renderDropZone();
          renderOrderBank();
        });
        bank.appendChild(button);
      });
    }

    function checkOrder() {
      const expected = expectedOrder();
      const ok = expected.length > 0
        && pickedOrder.length === expected.length
        && expected.every((value, index) => value === pickedOrder[index]);
      if (!ok) {
        document.getElementById("orderStatus").textContent = pickedOrder.length
          ? "顺序还需要调整"
          : "请先选择答案";
        pickedOrder = [];
        renderDropZone();
        renderOrderBank();
        return;
      }
      document.getElementById("orderStatus").textContent = "";
      showCelebration('接对了！<span class="ko">순서가 맞아요!</span>', '顺序很准确，继续保持！<span class="ko">정확해요, 계속 해봐요!</span>', "🌟");
      let step = 0;
      const playSequence = () => {
        if (step >= expected.length) return;
        setLine(expected[step], true);
        step += 1;
        player.onended = playSequence;
      };
      setLine(orderStart, true);
      step = 0;
      player.onended = playSequence;
    }

    buildPlaylist();
    buildFullLyrics();
    prepareFullTrack("vocal");
    setLine(0, false);

    document.querySelectorAll(".mode-tabs button").forEach((button) => {
      button.addEventListener("click", () => setPanel(button.dataset.panel));
    });
    document.getElementById("prevBtn").addEventListener("click", () => setLine(current - 1, true));
    document.getElementById("nextBtn").addEventListener("click", () => setLine(current + 1, true));
    document.getElementById("randomBtn").addEventListener("click", () => setLine(Math.floor(Math.random() * lines.length), true));
    playBtn.addEventListener("click", playCurrent);
    repeatBtn.addEventListener("click", () => {
      looping = !looping;
      repeatBtn.innerHTML = looping ? '停止循环<span class="ko">반복 중지</span>' : '循环<span class="ko">반복</span>';
      repeatBtn.classList.toggle("primary", looping);
    });
    pinyinToggle.addEventListener("change", () => pinyinText.classList.toggle("hidden", !pinyinToggle.checked));
    meaningToggle.addEventListener("change", () => meaningText.classList.toggle("hidden", !meaningToggle.checked));
    player.addEventListener("timeupdate", updateKaraokeProgress);
    player.addEventListener("ended", () => {
      if (player.duration && !Number.isNaN(player.duration)) {
        lastPracticeDuration = player.duration * 1000;
      }
      fillKaraokeChars(lyricText, 100);
      lyricText.classList.remove("karaoke-active");
      if (looping) {
        playCurrent();
        return;
      }
      if (autoNextToggle.checked) {
        setLine(current + 1, true);
        return;
      }
      showSingCue();
    });
    fullPlayer.addEventListener("loadedmetadata", () => {
      createFullTimeline();
      updateFullSong();
    });
    fullPlayer.addEventListener("timeupdate", updateFullSong);
    fullPlayer.addEventListener("ended", () => {
      fullProgressBar.style.width = "100%";
      showCelebration('唱完了！<span class="ko">완곡했어요!</span>', '全曲练习完成，真的很棒！<span class="ko">끝까지 잘 불렀어요!</span>', "🎤");
    });
    progressToggle.addEventListener("click", () => {
      side.classList.toggle("open");
      progressToggle.innerHTML = side.classList.contains("open")
        ? '收起课堂进度<span class="ko">진도 닫기</span>'
        : '打开课堂进度<span class="ko">진도 열기</span>';
    });
    celebration.addEventListener("click", () => {
      celebration.classList.remove("show");
    });

    document.getElementById("memoryNewBtn").addEventListener("click", () => newMemoryRound());
    document.getElementById("memoryRevealBtn").addEventListener("click", revealMemory);
    document.getElementById("memoryPlayBtn").addEventListener("click", () => {
      setLine(memoryIndex, true);
    });
    document.querySelectorAll("[data-memory-mode]").forEach((button) => {
      button.addEventListener("click", () => {
        memoryMode = button.dataset.memoryMode;
        document.querySelectorAll("[data-memory-mode]").forEach((item) => {
          item.classList.toggle("active", item === button);
        });
        newMemoryRound();
      });
    });

    document.getElementById("orderNewBtn").addEventListener("click", () => newOrderRound());
    document.getElementById("orderCheckBtn").addEventListener("click", checkOrder);
    document.getElementById("orderPlayBtn").addEventListener("click", () => {
      setLine(orderStart, true);
    });
    document.querySelectorAll("[data-order-count]").forEach((button) => {
      button.addEventListener("click", () => {
        orderCount = Number(button.dataset.orderCount);
        document.querySelectorAll("[data-order-count]").forEach((item) => {
          item.classList.toggle("active", item === button);
        });
        newOrderRound();
      });
    });
    document.querySelectorAll("[data-full-track]").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll("[data-full-track]").forEach((item) => {
          item.classList.toggle("active", item === button);
        });
        prepareFullTrack(button.dataset.fullTrack);
      });
    });
    document.getElementById("fullPlayBtn").addEventListener("click", () => {
      player.pause();
      seekFullLine(selectedFullIndex);
      fullPlayer.play().catch(() => {});
    });
    document.getElementById("fullPauseBtn").addEventListener("click", () => {
      fullPlayer.pause();
    });
    document.getElementById("fullRestartBtn").addEventListener("click", () => {
      fullPlayer.currentTime = 0;
      selectFullLine(0);
      updateFullSong();
      fullPlayer.play().catch(() => {});
    });
    fullPinyinBtn.addEventListener("click", () => {
      showFullPinyin = !showFullPinyin;
      fullLyrics.classList.toggle("hide-pinyin", !showFullPinyin);
      fullPinyinBtn.innerHTML = showFullPinyin
        ? '隐藏拼音<span class="ko">병음 숨기기</span>'
        : '显示拼音<span class="ko">병음 보기</span>';
    });
    fullBlankModeBtn.addEventListener("click", () => setFullBlankMode(!fullBlankMode));
    blankRefreshBtn.addEventListener("click", refreshFullBlanks);
    calibrationToggleBtn.addEventListener("click", () => {
      calibrationMode = !calibrationMode;
      calibrationBox.classList.toggle("active", calibrationMode);
      calibrationToggleBtn.classList.toggle("primary", calibrationMode);
      calibrationTimes = savedTimelineStarts() || [];
      calibrationIndex = calibrationTimes.length < currentFullLines().length ? calibrationTimes.length : selectedFullIndex;
      selectedFullIndex = calibrationIndex;
      updateFullLyrics(fullActiveIndex);
      updateCalibrationStatus();
    });
    markLineBtn.addEventListener("click", () => {
      calibrationTimes[calibrationIndex] = fullPlayer.currentTime;
      persistCalibrationTimes();
      const completed = saveCalibrationIfComplete();
      if (!completed) {
        calibrationIndex = Math.min(calibrationIndex + 1, currentFullLines().length - 1);
        selectedFullIndex = calibrationIndex;
        updateFullLyrics(fullActiveIndex);
        updateCalibrationStatus();
      }
    });
    shiftAllEarlier05Btn.addEventListener("click", () => shiftCalibration("all", -0.5));
    shiftAllLater05Btn.addEventListener("click", () => shiftCalibration("all", 0.5));
    shiftAllEarlier1Btn.addEventListener("click", () => shiftCalibration("all", -1));
    shiftAllLater1Btn.addEventListener("click", () => shiftCalibration("all", 1));
    shiftLineEarlierBtn.addEventListener("click", () => shiftCalibration("line", -0.2));
    shiftLineLaterBtn.addEventListener("click", () => shiftCalibration("line", 0.2));
    resetCalibrationBtn.addEventListener("click", () => {
      localStorage.removeItem(timelineStorageKey());
      calibrationTimes = [];
      calibrationIndex = 0;
      selectedFullIndex = 0;
      createFullTimeline();
      updateFullSong();
      updateCalibrationStatus();
    });
  </script>
</body>
</html>
